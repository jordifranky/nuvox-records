
# ===================================================================
# NUVOX RECORDS - CONFIGURACION GENERAL
# ===================================================================
spring.application.name=nuvox-records-backend
server.port=${PORT:8080}

# ===================================================================
# POSTGRESQL - CONEXION LOCAL Y NUBE
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://[::1]:5432/%20nuvox_records_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:j129}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIKARICP - POOL DE CONEXIONES
# ===================================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# SPRING DATA JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false
