# Base de datos SOLO para pruebas (se recrea en cada ejecucion; no usar la de desarrollo).
# Crear una vez:  CREATE DATABASE nuvox_records_test;
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/nuvox_records_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Usuarios ficticios solo para la BD de pruebas (nunca en producción)
nuvox.seed.enabled=true
nuvox.seed.curator-password=Nuvox2024!
nuvox.seed.artist-password=Artista2024!
nuvox.seed.admin-password=Admin123!
